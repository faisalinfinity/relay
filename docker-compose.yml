services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      # 5433 on the host so it doesn't fight a locally installed Postgres
      - '${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay -d relay']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
